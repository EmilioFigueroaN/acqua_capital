name: Backup diario Supabase

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Hacer dump de la base
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          FECHA=$(date +'%Y-%m-%d')
          pg_dump "$DB_URL" --schema=public --format=custom -f "backup-$FECHA.dump"

      - name: Subir backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-supabase
          path: backup-*.dump
          retention-days: 30
